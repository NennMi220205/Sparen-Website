<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wertvoll? – Login</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
<header>
  <div class="container">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Wertvoll?</h1>
        <div class="subtitle">Demo-Login (Prüfer-Modus)</div>
      </div>
    </div>
  </div>
</header>

<main class="container auth-layout">
  <div class="auth-grid">
    <div class="card">
      <h2 class="headline">Demo-Accounts</h2>
      <p class="muted">Nutze einen dieser Accounts:</p>
      <ul class="muted">
        <li><b>Eltern:</b> parent@test.de / parent123</li>
        <li><b>Kind 1:</b> kid1@test.de / kid123</li>
        <li><b>Kind 2:</b> kid2@test.de / kid123</li>
      </ul>
      <p class="muted">Familien-Schlüssel (fix): <b>AB3F9Q</b></p>
    </div>

    <div class="card">
      <h3 class="headline-sm">Einloggen</h3>
      <p class="muted">Melde dich mit einem Demo-Account an.</p>

      <form id="loginForm" style="margin-top:8px">
        <div style="margin-bottom:8px">
          <label for="loginEmail">E-Mail</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div style="margin-bottom:10px">
          <label for="loginPassword">Passwort</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="btn" style="width:100%">Einloggen</button>
        <p id="loginError" class="error"></p>
      </form>
    </div>
  </div>
</main>

<script>
  const loginForm = document.getElementById("loginForm");
  const loginError = document.getElementById("loginError");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.textContent = "";

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (!data.success) {
        loginError.textContent = data.message || "Login fehlgeschlagen.";
        return;
      }

      localStorage.setItem("loggedInEmail", data.email);
      localStorage.setItem("loggedInRole", data.role);
      if (data.familyKey) localStorage.setItem("familyKey", data.familyKey);

      window.location.href = "app.html";
    } catch (err) {
      console.error(err);
      loginError.textContent = "Server nicht erreichbar?";
    }
  });
</script>
</body>
</html>
