<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wertvoll? – Deine Woche</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="main.css" />
</head>
<body>
<header>
  <div class="container">
    <div class="row" style="justify-content:space-between">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Wertvoll?</h1>
          <div class="subtitle" id="headerSubtitle"></div>
        </div>
      </div>
      <div class="row">
        <button class="tab active" data-view="dashboard">Übersicht</button>
        <button class="tab" data-view="new" id="tabNew">Neuer Kauf</button>
        <button class="tab" data-view="family">Familie</button>
        <button class="btn ghost" id="logoutBtn">Abmelden</button>
      </div>
    </div>
  </div>
</header>

<main class="container">

  <!-- DASHBOARD -->
  <section id="dashboard" class="view">
    <!-- (gekürzt – dein kompletter Inhalt kommt hier rein) -->
  </section>

  <!-- NEUER KAUF -->
  <section id="new" class="view" hidden></section>

  <!-- FAMILIE -->
  <section id="family" class="view" hidden></section>

</main>

<script src="app.js"></script>
</body>
</html>
