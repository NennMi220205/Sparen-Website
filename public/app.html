<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wertvoll? – App</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <header class="container">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Wertvoll?</h2>
      <button class="btn ghost" id="logoutBtn">Abmelden</button>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h3 class="headline-sm">Du bist eingeloggt</h3>
      <p class="muted" id="who"></p>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 class="headline-sm">State-Test</h3>
      <button class="btn secondary" id="loadBtn">State laden</button>
      <pre id="out" style="white-space:pre-wrap"></pre>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
